</style></head><body class="planningonly"><main><div id="app"></div><noscript>Bitte JavaScript aktivieren, um Stunden zu planen.</noscript></main><footer><p>SchachStunde · Schachunterricht einfach planen · Lokal gespeichert · Planung ohne KI</p><p><a href="https://edmundbruns.github.io/schachstunde/SchachStunde.zip" target="_blank" rel="noopener">Gesamtes Paket</a> · <a href="https://edmundbruns.github.io/schachstunde/SchachStunde.html" target="_blank" rel="noopener">Offline-Datei</a> · <a href="#" id="startguide">Kurzanleitung</a> · <a href="#" id="credits">Quellen & Lizenzen</a> · <a href="https://edmundbruns.com/impressum/" target="_blank" rel="noopener">Impressum</a> · <a href="https://edmundbruns.com/datenschutz/" target="_blank" rel="noopener">Datenschutz</a></p></footer><section id="printarea"></section><dialog id="dialog"><button id="close" class="close">Schließen ×</button><div id="detail"></div></dialog><script type="module">window.PLANNER_LICENSE="<!doctype html><html lang=\"de\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Quellen und Lizenzen \u00b7 SchachStunde</title><link rel=\"stylesheet\" href=\"style.css\"><style>body{margin:0;background:#f3eee5;color:#20363d;font:16px/1.6 system-ui,\"Segoe UI\",Arial,sans-serif}</style><body class=\"docbody\"><div class=\"docpage\"><div class=\"dochead\"><p class=\"doceyebrow\">SchachStunde</p><h1>Quellen und Lizenzen</h1><p>Stand: 18. Oktober 2026. Unabh\u00e4ngiges Angebot, keine Verbindung zu den genannten Anbietern.</p></div><section class=\"docsec\"><h2>Aufgaben</h2><p><b>Aufgaben aus echten Partien:</b> 72 Datens\u00e4tze aus der <a href=\"https://database.lichess.org/#puzzles\">Lichess Open Database</a>, Lizenz <a href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0 1.0</a>. Alle Originalfelder (PuzzleId, FEN, Moves, GameUrl) liegen in assets/puzzles.json. Im PDF stehen die verwendeten Aufgabennummern auf der Seite \u201eQuellen und Lizenzen\u201c.</p><p><b>Eigene Aufgaben:</b> Regel\u00fcbungen, Kontrastpaare, Gabelaufgaben, Stunde 0, Profi-Aufgaben und Labyrinthe sind eigene Entw\u00fcrfe von Dr. Edmund Bruns. Stellungen und Zugfolgen sind mit chess.js gepr\u00fcft, k\u00fcrzeste Labyrinthwege rechnerisch.</p></section><section class=\"docsec\"><h2>Abbildungen</h2><p>Schachfiguren: <a href=\"https://commons.wikimedia.org/wiki/User:Cburnett\">Cburnett</a> und die bei den Einzeldateien genannten Mitwirkenden, Wikimedia Commons. Lizenz: <a href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a>. Die SVG-Dateien sind unver\u00e4ndert und werden nur skaliert. Bei Weitergabe Namensnennung und Lizenzhinweis beibehalten.</p><details><summary>Alle zw\u00f6lf Dateien</summary><ul><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_plt45.svg\">Chess_plt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_pdt45.svg\">Chess_pdt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_rlt45.svg\">Chess_rlt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_rdt45.svg\">Chess_rdt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_nlt45.svg\">Chess_nlt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_ndt45.svg\">Chess_ndt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_blt45.svg\">Chess_blt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_bdt45.svg\">Chess_bdt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_qlt45.svg\">Chess_qlt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_qdt45.svg\">Chess_qdt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_klt45.svg\">Chess_klt45.svg</a></li><li><a href=\"https://commons.wikimedia.org/wiki/File:Chess_kdt45.svg\">Chess_kdt45.svg</a></li></ul></details></section><section class=\"docsec\"><h2>Methoden</h2><p>Alle 63 Methoden sind eigene Formulierungen. Bei den folgenden wurde eine \u00f6ffentlich beschriebene Grundidee aufgegriffen und eigenst\u00e4ndig umgesetzt. Es wurden keine Originalkarten \u00fcbernommen.</p><h3>Walter R\u00e4dler, Schachmethoden (Lehrgang Dillingen), Bezug \u00fcber die Deutsche Schachjugend</h3><p><a href=\"https://schachtraining.de/wp-content/uploads/iNGOLSTADT-SCHACHMETHODEN-Dillingen.pdf\">https://schachtraining.de/wp-content/uploads/iNGOLSTADT-SCHACHMETHODEN-Dillingen.pdf</a></p><ul><li><b>Einen Fehler finden und verbessern</b>: Eigenst\u00e4ndiges verwandtes Verfahren. Der Ablauf kann vom Originalkoffer abweichen.</li><li><b>Erst entscheiden, dann noch einmal pr\u00fcfen</b>: Eigenst\u00e4ndiges verwandtes Verfahren. Der Ablauf kann vom Originalkoffer abweichen.</li><li><b>Einen erlaubten Figurenweg finden</b>: Eigenst\u00e4ndiges verwandtes Verfahren. Der Ablauf kann vom Originalkoffer abweichen.</li><li><b>Einen Zug im Kopf ausf\u00fchren</b>: Eigenst\u00e4ndiges verwandtes Verfahren. Der Ablauf kann vom Originalkoffer abweichen.</li><li><b>Zu zweit ein Team bilden</b>: Eigenst\u00e4ndiges verwandtes Verfahren. Der Ablauf kann vom Originalkoffer abweichen.</li><li><b>Figurenwerte zusammenrechnen</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Erst einen schlechten Plan finden, dann verbessern</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Die letzten Z\u00fcge einer Kurzpartie im Kopf finden</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Gleiche Mattbilder finden und den Zug erkl\u00e4ren (Originalname: \u201eSchach-Memory\u201c)</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Zu einer Schachbehauptung abstimmen</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Eine Stellung gemeinsam schriftlich untersuchen</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Von Aussage zu Aussage gehen und pr\u00fcfen</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Eine Lehrkraft spielt an mehreren Brettern</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Mattaufgaben l\u00f6sen und die Begr\u00fcndung vergleichen</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Ein zerschnittenes Schachbild zusammensetzen (Originalname: \u201eDas Schachpuzzle\u201c)</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li><li><b>Nach Feldnamen ein Muster ausmalen</b>: Eigene Anleitung nach \u00f6ffentlich beschriebener Grundidee.</li></ul><h3>Schachw\u00fcrfel-Anleitung (euroschach.de)</h3><p><a href=\"https://www.euroschach.de/media/products/schachwuerfel-anleitung.pdf\">https://www.euroschach.de/media/products/schachwuerfel-anleitung.pdf</a></p><ul><li><b>Ein Motiv auslosen und eine Stellung dazu bauen</b>: Eigene Variante. Die genaue Abweichung steht in der Anleitung.</li><li><b>Mit Figurenw\u00fcrfeln Punkte sammeln (Originalname: \u201eKnuffelschach\u201c)</b>: Eigene Variante. Die genaue Abweichung steht in der Anleitung.</li><li><b>Die Figurenart f\u00fcr den n\u00e4chsten Zug w\u00fcrfeln</b>: Eigene Variante. Die genaue Abweichung steht in der Anleitung.</li></ul><p>Alle \u00fcbrigen Methoden: eigene Zusammenstellung nach allgemeiner Unterrichtspraxis.</p></section><section class=\"docsec\"><h2>Didaktische Grundlagen</h2><ul><li>Meyer, Hilbert: <i>Leitfaden Unterrichtsvorbereitung</i>. Berlin: Cornelsen Scriptor. Grundlage f\u00fcr Phasenmodell, Lernziele und Ergebnissicherung.</li><li>St\u00e4deli, Christoph; Grassi, Andreas; Rhiner, Katy; Obrist, Willy: <i>Kompetenzorientiert unterrichten. Das AVIVA-Modell</i>. Bern: hep verlag. Anregung f\u00fcr Ankommen, Vorwissen aktivieren und Auswerten.</li><li>Stappenmethode (Brunia, van Wijgerden): <a href=\"https://www.stappenmethode.nl/en/material/step1\">stappenmethode.nl</a>. Anregung f\u00fcr kleinschrittige Themenfolge und \u00dcbungsbl\u00e4tter.</li><li>Chess in Schools and Communities, Curriculum: <a href=\"https://www.chessinschools.co.uk/csc-curriculum\">chessinschools.co.uk</a>; <i>Chess for Schools</i>, Crown House: <a href=\"https://www.crownhouse.co.uk/chess-for-schools\">crownhouse.co.uk</a>.</li><li>ChessKid-Curriculum: <a href=\"https://www.chesskid.com/learn/articles/chesskidcoms-curriculum\">chesskid.com</a>. Leitfragen und Minispiele.</li><li>O\u2019Donnell, Tom / Chess Federation of Canada: <i>Teaching Manual</i> (1997): <a href=\"https://www.albertachess.org/Teaching%20Manual.pdf\">albertachess.org</a>.</li><li>Chicago Chess Foundation, Materialien: <a href=\"https://chicagochessfoundation.org/resources\">chicagochessfoundation.org</a>. Denkwege und \u00dcbungen f\u00fcr verschiedene Spielst\u00e4rken.</li></ul><p>Aus diesen Quellen wurden keine Texte, Diagramme oder Aufgaben \u00fcbernommen. Sie dienten als fachliche Anregung.</p></section><section class=\"docsec\"><h2>Schachdiplom</h2><p>Der Jahresplan im Praxiswissen verweist auf das <a href=\"https://ludgerus-schachdiplom.netlify.app/\">Ludgerus-Schachdiplom</a> (Bronze, Silber, Gold) von Dr. Edmund Bruns. Die Zuordnung der Stunden zu den Diplom-Missionen ist ein Vorschlag.</p></section><section class=\"docsec\"><h2>Software</h2><p><b>chess.js 1.4.0</b> (<a href=\"https://github.com/jhlywa/chess.js\">Projektquelle</a>), BSD-2-Clause. Lokal mitgeliefert: <b>PDF.js 4.10.38</b> (Mozilla, Apache 2.0), <b>Mammoth.js 1.9.1</b> (BSD-2-Clause), <b>docx 9.5.1</b> (MIT) zum Einlesen eigener Unterlagen.</p><details><summary>Lizenztext chess.js</summary><pre>Copyright (c) 2025, Jeff Hlywa (jhlywa@gmail.com)\nAll rights reserved.\n\nRedistribution and use in source and binary forms, with or without\nmodification, are permitted provided that the following conditions are met:\n\n1. Redistributions of source code must retain the above copyright notice,\n   this list of conditions and the following disclaime window.PLANNER_START="<!doctype html><html lang=\"de\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Kurzanleitung \u00b7 SchachStunde</title><link rel=\"stylesheet\" href=\"style.css\"><style>body{margin:0;background:#f3eee5;color:#20363d;font:16px/1.6 system-ui,\"Segoe UI\",Arial,sans-serif}</style><body class=\"docbody\"><div class=\"docpage\"><div class=\"dochead\"><p class=\"doceyebrow\">SchachStunde</p><h1>Kurzanleitung</h1><p>Schachunterricht einfach planen: vom Thema zur fertigen Stunde mit Arbeitsbl\u00e4ttern als PDF.</p></div><section class=\"docsec\"><h2>In vier Schritten zur Stunde</h2><ol><li><b>Fertige Stunde w\u00e4hlen.</b> \u201eUnterrichtseinheiten ausw\u00e4hlen\u201c bietet 28 Einzelstunden (einschlie\u00dflich Stunde 0) und 3 Reihen. Oder unter \u201eSchachstunde planen\u201c Niveau und Thema w\u00e4hlen.</li><li><b>Plan lesen und anpassen.</b> Sechs Phasen von Einstieg bis Abschluss. \u201eAnpassen\u201c \u00e4ndert eine Phase, \u201eAusf\u00fchrlich\u201c zeigt den vollst\u00e4ndigen Auftrag.</li><li><b>\u201eStunde als PDF\u201c drucken.</b> Im Druckdialog \u201eAls PDF speichern\u201c, A4, R\u00e4nder Standard, Kopf- und Fu\u00dfzeilen aus.</li><li><b>Brett vorbereiten.</b> Demobrett oder Beamer mit dem Lehrbrett.</li></ol></section><section class=\"docsec\"><h2>Der Plan</h2><ul><li>Kopf: Lernziel, Einstieg mit Begr\u00fcndung, Material mit Fundstelle im PDF, St\u00fcckzahlen zum Vorbereiten, Differenzierung.</li><li>Tabelle: Phase und Zeit, was die Lehrkraft tut, was die Kinder tun, Sozialform und Medium.</li><li>Fu\u00df: Merksatz, Lerncheck-Kriterien, \u201eFr\u00fcher fertig\u201c, \u201eZeit wird knapp\u201c, \u201eGemischte Gruppe\u201c mit Profi-Aufgabe.</li><li>Begriffe mit einem kleinen <b>?</b> erkl\u00e4ren sich beim Antippen.</li><li>Zur\u00fcck aus Lehrbrett oder Druckvorschau landest du wieder an derselben Stelle.</li></ul></section><section class=\"docsec\"><h2>Das PDF-Paket</h2><ol><li>Verlaufsplan (eine Seite quer)</li><li>Arbeitsblatt Teil A bis D (eine Seite)</li><li>Lerncheck 2\u00d7 A5 zum Schneiden</li><li>Lehrkraft-Handreichung mit L\u00f6sungen, Hilfekarten, Kontrastpaar und Profi-Karte</li><li>Seite \u201eQuellen und Lizenzen\u201c</li></ol><p>Einzelne Bl\u00e4tter (Arbeitsblatt mit 2, 4 oder 6 Aufgaben, L\u00f6sungen, Lerncheck, Hilfekarten, Vorbereitungsliste) gibt es unter \u201eMaterialbl\u00e4tter\u201c im selben Layout.</p></section><section class=\"docsec\"><h2>Lehrbrett</h2><p>\u00d6ffnet aus jeder Phase mit den passenden Aufgaben. Richtige L\u00f6sungen f\u00e4rben die R\u00fcckmeldung gr\u00fcn, bei mehrz\u00fcgigen Aufgaben folgt der Gegenzug automatisch. \u201eWiederholen\u201c startet neu, \u201eL\u00f6sung\u201c zeigt den Weg. Brett drehen, markieren, Pfeile und eigene Stellungen (FEN) sind m\u00f6glich.</p></section><section class=\"docsec\"><h2>Methoden und Praxiswissen</h2><p><b>Methoden kennenlernen:</b> 63 Methoden als Kurzkarte mit \u201eDu brauchst\u201c, \u201eSo geht\u2019s\u201c und Beispiel. Jede Karte l\u00e4sst sich drucken.</p><p><b>Praxiswissen:</b> erste Stunde, gemischte Spielst\u00e4rken, Spielphasen und Schachuhr, Jahresplan mit Bezug zum Ludgerus-Schachdiplom, Glossar. Auch als PDF.</p></section><section class=\"docsec\"><h2>Speichern</h2><p>Planungen bleiben im Browser gespeichert. \u00dcber \u201eSicherung\u201c eine Datei herunterladen und bei Bedarf wieder einlesen, etwa beim Wechsel zwischen Website und Offline-Datei. Die Offline-Datei <b>SchachStunde.html</b> l\u00e4uft ohne Internet.</p></section><p class=\"docfoot\">SchachStunde \u00b7 \u00a9 Dr. Edmund Bruns \u00b7 <a href=\"index.html\">Zur Anwendung</a> \u00b7 <a href=\"START.html\">Kurzanleitung</a> \u00b7 <a href=\"LICENSES.html\">Quellen &amp; Lizenzen</a></p></div></body></html>";

nau einem Merkmal unterscheiden.','Erst einzeln entscheiden lassen.','Kinder erklären, welches Merkmal den Unterschied macht.'],teachback:['Ein Kind liest die Regel und legt die Vorlage weg.','Es erklärt dem Partner die Regel an der Aufgabe.','Partner führt den Zug aus und fragt bei Unklarheit nach; danach wechseln.'],worked:['Ein Lösungsbeispiel zeigen, in dem ein Prüfschritt fehlt.','Kinder ergänzen den fehlenden Schritt und begründen ihn.','Danach eine neue Aufgabe ohne Vorlage lösen.'],vote:['Alle entscheiden verdeckt: ja oder nein?','Paare tauschen ihre Gründe aus und prüfen am Brett.','Erneut entscheiden und erklären, welcher Grund ausschlaggebend war.'],reverse:['Ein Ergebnis vorgeben, das die Stellung zeigen soll.','Paare bauen eine passende Stellung oder verändern genau eine Figur.','Anderes Paar testet den Entwurf; die Veränderung erklären lassen.'],secure:['Am schon bearbeiteten Beispiel einen Regelsatz sammeln.','Ein Kind zeigt einen konkreten Beleg für den Satz.','Alle übernehmen die geprüfte Regel als Satz oder Zeichnung.'],examplecounter:['Ein Beispiel und ein ähnliches Gegenbeispiel zeigen.','Kinder zeigen, was trotz ähnlicher Stellung anders ist.','Die Regel mit dem entscheidenden Unterschied formulieren.'],peercheck:['Beide lösen erst allein.','Lösungen tauschen und mit den genannten Kriterien prüfen: Entscheidung richtig? Beleg am Brett nachvollziehbar?','Eine begründete Rückmeldung geben; jedes Kind verbessert seine eigene Antwort.'],repair:['Eine eigene oder typische falsche Vermutung auswählen.','Kinder zeigen am Brett, warum sie nicht stimmt.','Einen richtigen Zug zeigen und die korrigierte Regel sagen.'],transfercard:['An die zuvor geprüfte Aufgabe erinnern.','Eine veränderte Aufgabe allein prüfen lassen.','Notieren oder sagen: „Was bleibt gleich, was ändert die Entscheidung?“'],confidence:['Vor dem Prüfen zeigen lassen: sicher, unsicher oder noch keine Idee.','Lösung notieren und den eigenen Beleg am Brett kontrollieren.','Sicherheit erneut einschätzen und einen Grund für eine Änderung nennen.'],labyrinth:['Start, Ziel und Hinderniszeichen gemeinsam klären.','Ein Kind plant einen Weg, das andere prüft jeden Abschnitt.','Weg nachspielen, Rollen tauschen und einen kürzeren Weg suchen.'],mental:['Stellung betrachten, Figuren stehen lassen.','Einen Zug nur vorstellen; Zielfeld und neue Wirkung sagen.','Zug am Brett ausführen und die Vorstellung kontrollieren.'],reconstruct:['Vorlage 20 Sekunden zeigen und dann abdecken.','Paare bauen die Stellung auf einem zweiten Brett nach.','Vorlage aufdecken, vergleichen und eine hilfreiche Merkhilfe nennen.'],dictation:['Ein Kind sieht das Diagramm, das andere nur ein leeres Brett.','Mit Farbe, Figur und Feld diktieren; nach jeder Ansage kurz warten.','Bretter vergleichen, fehlende Angaben ergänzen und Rollen tauschen.'],consultation:['Zwei Zweierteams an ein Brett setzen.','Vor jedem Zug nennt jedes Teammitglied eine Idee; das Team entscheidet.','Ziehende Person nach jedem Zug wechseln; nach vier Halbzügen eine Entscheidung besprechen.'],freeze:['Von der Aufgabenstellung aus spielen; Stopps vorher vereinbaren.','Nach zwei Halbzügen fragen: „Was greift der Gegner an?“','Eine Antwort prüfen, dann weiterspielen; nach dem zweiten Stopp auswerten.'],defender:['Den ersten Lösungszug der Aufgabe ausführen.','Ein Kind sucht legale Verteidigungen, das andere prüft Fortsetzungen.','Mit der gespeicherten Hauptvariante vergleichen; ungeklärte Nebenvarianten als offen festhalten.']};
for(const r of rows){const m=C.methods.find(m=>m.id===r.id);if(!m)continue;m.formalName=m.name;m.name=r.name;m.quickSteps=r.steps;m.genericSteps=genericSteps[r.id]||r.steps;m.topic=({mini:'moves',maze:'maze-basic'}[r.topic]||r.topic);m.instruction=m.genericSteps.map((s,i)=>(i+1)+'. '+s).join(' ');m.goal=m.genericSteps[0];m.material=m.needs.includes('space')?'Bodenbrett mit Feldnamen und freier Fläche.':m.needs.includes('paper')?'Beispielbilder ausdrucken; Papier und Stifte; Brett zum Prüfen.':m.id==='reconstruct'||m.id==='dictation'?'Vorlage und ein leeres Schachbrett pro Paar.':'Ein sichtbares Beispiel und ein Schachbrett pro Paar oder ein gemeinsames Demobrett.';m.simpleHint='Auftrag vorlesen. Zuerst die beteiligten Figuren und Felder zeigen lassen. Nur einen Prüfschritt auf einmal verlangen.';m.simpleObserve='Kann jedes Kind seine Entscheidung am Beispiel zeigen und mit einer Regel oder einem Zug begründen?';}

window.KofferMethods=(()=>{const rows=[{"id": "koffer-figurenrechnen", "name": "Figurenwerte zusammenrechnen", "min": 8, "minGroup": 1, "topic": "moves", "index": 0, "steps": ["Lege einen weißen Turm, Läufer und zwei Bauern neben das Brett. Werte: Bauer 1, Springer 3, Läufer 3, Turm 5, Dame 9; der König bekommt keinen Tauschwert.", "Rechne die Werte zusammen. Stelle mit anderen Figuren dieselbe Summe dar.", "Vergleicht die Darstellungen: gleicher Rechenwert bedeutet nicht gleich starke Stellung."], "answer": "Turm 5 + Läufer 3 + zwei Bauern 2 = 10. Auch Dame 9 + Bauer 1 = 10.", "hint": "Nur Figurenwerte addieren, noch keine Stellungsbewertung verlangen."}, {"id": "koffer-kopfstand", "name": "Erst einen schlechten Plan finden, dann verbessern", "min": 10, "minGroup": 2, "topic": "endgame", "index": 2, "steps": ["Zeige die Bauernstellung. Frage: „Wie würde ich sicher zu spät beim Bauern ankommen?“", "Sammelt einen legalen Umweg. Kehrt die Idee um: Welcher direkte Weg hilft?", "Prüft die Verbesserung mit abwechselnden legalen Zügen. Ein guter Grundsatz garantiert noch keinen Fang."], "answer": "Nach a5 ist Schwarz am Zug. Ein legaler Umweg ist etwa Kg5: Der Weg zum Bauern wird länger. Der direkte Weg Ke5 ist besser, erreicht das Quadrat a5, d5, d8, a8 aber trotzdem nicht. Der Bauer wandelt um.", "hint": "Nur legale schlechte Züge verwenden, keine falschen Regeln einüben."}, {"id": "koffer-blindfinish", "name": "Die letzten Züge einer Kurzpartie im Kopf finden", "min": 10, "minGroup": 1, "topic": "notation", "index": 1, "steps": ["Spiele aus der Grundstellung e4 e5 Lc4 Sc6 Dh5 Sf6. Stoppe vor dem weißen Zug.", "Lass die Kinder den Mattzug zunächst nur ansagen und seine Wirkung erklären.", "Spielt den vorgeschlagenen Zug nach. Wer noch unsicher ist, darf das Brett die ganze Zeit ansehen."], "answer": "Dh5xf7 ist Matt. Die Dame f7 ist von Lc4 gedeckt; Schwarz kann weder ausweichen, schlagen noch dazwischenziehen.", "hint": "Zunächst nur einen Halbzug vorstellen. Erst später zwei oder drei ergänzen."}, {"id": "koffer-mattmemory", "name": "Gleiche Mattbilder finden und den Zug erklären", "min": 12, "minGroup": 2, "topic": "stalemate", "index": 1, "steps": ["Drucke drei verschiedene Mattaufgaben je zweimal aus. Mischt die sechs Karten und legt sie verdeckt aus.", "Ein Kind deckt zwei Karten auf. Bei gleichem Bild muss es zusätzlich den Mattzug zeigen.", "Richtig erklärt: Paar behalten und nächste Person ist dran. Sonst wieder verdecken. Ende, wenn alle Paare gefunden sind."], "answer": "Es zählen identische Diagrammpaare und ein korrekt geprüfter Mattzug. Nicht zwei beliebige Stellungen mit ähnlichen Figuren verbinden.", "hint": "Zum Einstieg alle Karten offen lassen. Paarzahl erst nach sicheren Antworten erhöhen."}, {"id": "koffer-motivewurf", "name": "Ein Motiv auslosen und eine Stellung dazu bauen", "min": 15, "minGroup": 2, "topic": "fork", "index": 0, "steps": ["Ordne die Würfelzahlen zu: 1 Gabel, 2 Fesselung, 3 Abzug, 4 Matt in eins, 5 Patt, 6 freie Wahl. Beide Könige müssen auf dem Brett sein.", "Würfelt einmal. Baut mit höchstens sechs Steinen ein Beispiel und schreibt Zugrecht, Frage und Lösung dazu.", "Ein anderes Paar prüft Regeln und Behauptung. Unklare Konstruktionen gemeinsam verbessern."], "answer": "Offene Konstruktionsaufgabe. Eine Gabel braucht zwei angegriffene Ziele; eine behauptete Gewinnfolge muss die Gegenantwort berücksichtigen.", "hint": "Nur bereits gelernte Motive auslosen; andere Zahlen neu würfeln."}, {"id": "koffer-tedtest", "name": "Zu einer Schachbehauptung abstimmen", "min": 8, "minGroup": 2, "topic": "castling", "index": 4, "steps": ["Zeige die Stellung und die Behauptung: „Weiß darf kurz rochieren.“ Alle stimmen zunächst verdeckt zu oder dagegen.", "Paare zeigen ihren Grund an einem Feld. Erst danach gemeinsam auflösen.", "Erneut abstimmen und erklären, welcher Beleg überzeugt hat."], "answer": "Nein: Der schwarze Turm auf g8 greift g1 an, das Zielfeld des weißen Königs. Die Rochade ist verboten.", "hint": "Drei Antwortkarten nutzen: stimmt, stimmt nicht, noch unsicher. Kein Kind muss sich vorführen lassen."}, {"id": "koffer-schreibkonferenz", "name": "Eine Stellung gemeinsam schriftlich untersuchen", "min": 12, "minGroup": 3, "topic": "planning", "index": 0, "steps": ["Gib jeder Dreiergruppe ein Diagramm und ein Blatt. Drei Minuten wird nicht gesprochen.", "A schreibt eine Zugidee mit Grund. B ergänzt eine gegnerische Antwort. C prüft und notiert eine Frage; danach rotieren.", "Zum Schluss dürft ihr sprechen: Spielt eine Variante nach und haltet eine geprüfte Erkenntnis fest."], "answer": "Beispiel Lg5 h6 Lh4 ist legal. Ein anderer legaler und begründeter Plan ist ebenfalls möglich. Offene Fragen als offen markieren.", "hint": "Satzanfänge anbieten: „Ich spiele …, weil …“ und „Der Gegner könnte …“."}, {"id": "koffer-rundreise", "name": "Von Aussage zu Aussage gehen und prüfen", "min": 15, "minGroup": 2, "topic": "pawn", "index": 0, "steps": ["Lege vier Aussagen im Raum aus. Jedes Paar erhält einen Antwortzettel. Aussagen: Bauern ziehen gerade; Bauern schlagen gerade; der Start-Doppelschritt darf über eine Figur gehen; Umwandlung kann zum Springer erfolgen.", "Paare gehen gemeinsam alle Plätze ab, notieren stimmt oder stimmt nicht und einen Beleg. Nach zwei Minuten zum nächsten Platz gehen.", "Löst gemeinsam auf. Eine falsche Aussage wird richtig formuliert."], "answer": "1 stimmt für normale Bauernzüge; 2 falsch, diagonal; 3 falsch, beide Felder müssen frei sein; 4 stimmt. Jede Aussage im passenden Regelkontext prüfen.", "hint": "Aussagen vorlesen und mündliche Antworten zulassen; freie Wege und ruhige Wechsel."}, {"id": "koffer-simultan", "name": "Eine Lehrkraft spielt an mehreren Brettern", "min": 20, "minGroup": 4, "topic": "opening", "index": 0, "steps": ["Beginne mit zwei oder drei Brettern und vereinbare: Die Kinder ziehen erst, wenn du am Brett stehst.", "Gehe reihum. Lass dir eine Zugidee erklären, spiele eine legale Antwort und gehe zum nächsten Brett.", "Nach zehn Minuten stoppen, ohne unfertige Partien zu werten. Jede Gruppe zeigt eine lehrreiche Entscheidung."], "answer": "Keine feste Gewinnlösung. Legale Züge, verständliche Begründungen und Beteiligung aller beobachten.", "hint": "Nur nutzen, wenn die Lehrkraft die Regeln sicher beherrscht. Kinder dürfen im Team beraten; starke Spielstärke ist keine Voraussetzung für die Kinder."}, {"id": "koffer-mattwettkampf", "name": "Mattaufgaben lösen und die Begründung vergleichen", "min": 12, "minGroup": 2, "topic": "mateIn1", "index": 0, "steps": ["Jedes Paar erhält dieselben drei Matt-in-eins-Aufgaben und acht Minuten Zeit. Richtiger Mattzug zählt einen Punkt, korrekte Erklärung einen weiteren.", "Alle denken erst allein, dann vergleicht das Paar. Prüft nach dem Zug Flucht, Schlagen und Dazwischenziehen.", "Nach acht Minuten gemeinsam auswerten. Ziel ist eine gründliche Lösung; Schnelligkeit gibt keine Zusatzpunkte."], "answer": "Für jede Aufgabe den gespeicherten Mattzug prüfen. Ohne legale Abwehr ist es Matt; ein Schach allein genügt nicht.", "hint": "Nur eine Aufgabe und eine Hilfe anbieten. Ergebnisse ohne öffentliche Rangliste rückmelden."}, {"id": "koffer-schachpuzzlebild", "name": "Ein zerschnittenes Schachbild zusammensetzen", "min": 10, "minGroup": 2, "topic": "promotion", "index": 3, "steps": ["Drucke das Beispieldiagramm aus und schneide es in vier große Teile. Lege ein vollständiges Lösungsbild verdeckt bereit.", "Paare setzen das Brett zusammen und erklären, woran sie Nachbarteile erkennen.", "Mit der Vorlage vergleichen. Danach im wiederhergestellten Bild den Bauern umwandeln."], "answer": "Das vollständige Originalbild ist die eindeutige Vorlage. Der schwarze Bauer d2 wandelt auf d1 um: d1=D, d1=T, d1=L und d1=S sind möglich.", "hint": "Zuerst nur zwei Teile schneiden. Feldnamen dürfen als Orientierung sichtbar bleiben."}, {"id": "koffer-knuffel", "name": "Mit Figurenwürfeln Punkte sammeln", "min": 15, "minGroup": 2, "topic": "exchange", "index": 0, "steps": ["Eigene Kurzvariante: fünf normale Würfel. 1=Bauer (1), 2=Springer (3), 3=Läufer (3), 4=Turm (5), 5=Dame (9), 6=Joker. Jedes Kind zeichnet fünf Kategorien: Bauer, Springer, Läufer, Turm, Dame.", "Reihum höchstens dreimal würfeln; passende Würfel dürfen liegen bleiben. Wähle dann eine noch freie Kategorie und zähle nur passende Figuren. Jeder Joker zählt einmal als gewählte Figur.", "Nach fünf Runden sind alle Kategorien gefüllt; unpassende Würfe bringen null. Addiert die fünf Ergebnisse. Höchste Summe gewinnt, bei Gleichstand gemeinsam gewonnen."], "answer": "Beispiel: 5,5,6,2,1 in Kategorie Dame: zwei Damen plus Joker = 27 Punkte. Keine Bonusfelder oder zusätzlichen Kombinationen in dieser Kurzvariante.", "hint": "Dies ist eine eigene vereinfachte Variante, nicht der Originalspielbogen. Figurenwerte sind Lernwerte, kein Königswert."}, {"id": "koffer-wuerfelschach", "name": "Die Figurenart für den nächsten Zug würfeln", "min": 15, "minGroup": 2, "topic": "opening", "index": 0, "steps": ["Eigene regelnahe Variante: 1=Bauer, 2=Springer, 3=Läufer, 4=Turm, 5=Dame, 6=König. Reguläre Grundstellung. Alle Schachregeln gelten weiterhin; rochieren zählt als Königszug.", "Vor jedem Zug würfeln und mit der gewürfelten Art einen legalen Zug machen. Gibt es keinen, erneut würfeln. Steht der König im Schach, nicht würfeln: eine beliebige legale Schachabwehr spielen.", "Matt und Patt beenden die Partie nach normalen Regeln. Nach zehn Minuten laufende Partie ohne Ergebniswertung stoppen und einen Zug erklären."], "answer": "In der Grundstellung können nur Bauern und Springer ziehen; andere Zahlen erfordern einen neuen Wurf. Der König wird niemals geschlagen.", "hint": "Eigene Variante, da die veröffentlichte Würfelanleitung das Spielende widersprüchlich beschreibt. Kein Sonderregelspiel im regulären digitalen Lehrbrett erzwingen."}, {"id": "koffer-feldbild", "name": "Nach Feldnamen ein Muster ausmalen", "min": 8, "minGroup": 1, "topic": "coordinates", "index": 0, "steps": ["Gib ein leeres Diagramm mit Feldnamen aus. Lies langsam a1, b2, c3, d4, e5, f6, g7, h8 vor.", "Kinder markieren jedes Feld. Nach je zwei Feldern kurz vergleichen.", "Das entstehende Muster benennen. Danach diktiert ein Kind eine andere Linie."], "answer": "Die acht Felder bilden die Diagonale a1–h8. Diese Übung trainiert Feldnamen, nicht das Schreiben vollständiger Züge.", "hint": "Linie zuerst, Reihe danach; bei Bedarf am Rand mit dem Finger mitgehen."}];

const MERK={"coordinates": ["Erst die Linie (Buchstabe), dann die Reihe (Zahl): d4. Rechts unten liegt ein helles Feld. Dreht man das Brett, bleiben alle Feldnamen gleich.", "Ich nenne ein Feld mit Buchstabe und Zahl und finde es auch auf dem gedrehten Brett."], "moves": ["Turm gerade, Läufer schräg, Dame beides, König ein Feld, Springer im L-Sprung. Nur der Springer darf über andere Figuren springen.", "Ich zeige zu einer Figur einen erlaubten und einen verbotenen Zug."], "pawn": ["Der Bauer zieht gerade nach vorn und schlägt schräg nach vorn. Vom Startfeld darf er zwei Felder ziehen, wenn beide frei sind. Rückwärts nie.", "Ich zeige an einem Beispiel den Unterschied zwischen Bauernzug und Bauernschlag."], "defend": ["Angegriffen ist eine Figur, die der Gegner schlagen kann. Gedeckt ist sie, wenn eine eigene Figur zurückschlagen kann. Vor dem Schlagen fragen: Wer schlägt zurück?", "Ich zeige Angreifer und Verteidiger einer Figur."], "check": ["Schach heißt: Der König ist angegriffen. Es gibt drei Abwehren: wegziehen, dazwischenstellen, den Angreifer schlagen. Der König darf nie ins Schach ziehen.", "Ich finde zu einem Schach eine legale Abwehr und nenne ihre Art."], "mateIn1": ["Matt heißt: Schach und keine Abwehr. Prüfe nach deinem Zug alle drei Abwehren: Fluchtfeld, Dazwischenziehen, Schlagen.", "Ich finde einen Mattzug und zeige, dass keine Abwehr hilft."], "fairplay": ["Bei einem Streit lassen wir die Stellung stehen, prüfen gemeinsam die Regel und holen bei Bedarf Hilfe. Wir besprechen den Zug, nicht die Person.", "Ich kläre eine Streitfrage ruhig mit einer Regel."], "hangingPiece": ["Bevor du schlägst, frage: Wer schlägt zurück? Eine ungedeckte Figur kann man gewinnen. Eine gedeckte nur, wenn sie mehr wert ist als die schlagende Figur.", "Ich prüfe vor dem Schlag, ob der Gegner zurückschlagen kann."], "fork": ["Eine Gabel greift zwei Figuren gleichzeitig an. Der Gegner kann meist nur eine retten. Prüfe vorher: Steht deine Figur auf dem Gabelfeld sicher?", "Ich zeige beide angegriffenen Ziele und prüfe, ob das Gabelfeld sicher ist."], "pin": ["Gefesselt ist eine Figur, die ein gegnerischer Turm, Läufer oder eine Dame angreift, während hinter ihr auf derselben Linie eine wertvollere eigene Figur steht. Steht dort der König (absolute Fesselung), darf sie die Linie nicht verlassen. Steht dort eine andere Figur (relative Fesselung), darf sie ziehen, verliert aber Material.", "Ich sage, ob der König oder eine andere Figur hinter der gefesselten Figur steht, und was daraus folgt."], "opening": ["In der Eröffnung: die Mitte besetzen, Springer und Läufer entwickeln, den König durch die Rochade sichern. Vor jedem Zug prüfen: Was droht der Gegner?", "Ich begründe einen Entwicklungszug mit Mitte, Entwicklung oder Königssicherheit."], "endgame": ["Quadratregel: Vom Bauern bis zur Umwandlungsreihe ein Quadrat denken. Kommt der König hinein, wenn er am Zug ist, holt er den Bauern ein. Ein einziges Tempo kann entscheiden.", "Ich prüfe mit dem Quadrat und einer Zugfolge, ob der König den Bauern einholt."], "discoveredAttack": ["Beim Abzug zieht eine Figur weg und gibt die Linie für eine zweite frei. Dann greifen zwei Figuren gleichzeitig an.", "Ich zeige nach einem Abzug beide Angriffe."], "mateIn2": ["Erst den Schlüsselzug finden, dann jede sinnvolle Antwort prüfen: Schach, Schlagen, Flucht. Matt in zwei gilt nur, wenn es gegen jede Antwort klappt.", "Ich zeige zu meinem ersten Zug die stärkste Antwort und das Matt danach."], "calculation": ["Kandidaten sammeln, für jeden die stärkste Antwort des Gegners suchen, dann vergleichen. Erst prüfen, dann ziehen.", "Ich vergleiche zwei Kandidaten mit je einer Gegenantwort."], "planning": ["Ein Plan beginnt mit einer Frage an die Stellung: Welche Figur steht schlecht? Was will der Gegner? Erst danach den Zug wählen.", "Ich nenne ein Ziel, einen passenden Zug und eine mögliche Antwort des Gegners."], "rookend": ["Erst Luft für den eigenen König, dann den Turm aktivieren. Die 7. Reihe und offene Linien sind starke Turmfelder. Ein passiver Turm verteidigt nur.", "Ich vergleiche zwei Turmzüge und prüfe vorher die eigene Grundreihe."], "castling": ["Rochieren darf man nur, wenn König und Turm noch nicht gezogen haben und alle Felder dazwischen frei sind. Der König darf nicht im Schach stehen, über kein angegriffenes Feld ziehen und nicht im Schach landen.", "Ich prüfe alle Rochadebedingungen und nenne bei einem Verbot den Grund."], "promotion": ["Erreicht ein Bauer die letzte Reihe, wird er im selben Zug zu Dame, Turm, Läufer oder Springer. Meist wählt man die Dame, manchmal ist der Springer besser.", "Ich führe eine Umwandlung aus und nenne alle vier möglichen Figuren."], "stalemate": ["Matt: König im Schach und kein legaler Zug. Patt: König nicht im Schach, aber kein legaler Zug für die Seite am Zug. Patt ist unentschieden.", "Ich unterscheide Matt und Patt mit zwei Fragen: Schach? Gibt es einen legalen Zug?"], "notation": ["Figurenbuchstabe (K, D, T, L, S) und Zielfeld: Sf3. Bauern ohne Buchstaben: e4. Schlagen mit x: exd5. Schach mit +, Matt mit #.", "Ich notiere drei Züge richtig und spiele eine notierte Folge nach."], "enpassant": ["Zieht ein gegnerischer Bauer zwei Felder und landet neben deinem Bauern, darfst du ihn sofort im nächsten Zug so schlagen, als wäre er nur ein Feld gezogen. Später nicht mehr.", "Ich zeige Zielfeld und geschlagenen Bauern und sage, warum es nur sofort geht."], "doublecheck": ["Beim Doppelschach greifen zwei Figuren den König an. Dazwischenziehen oder Schlagen hilft nicht gegen beide: Der König muss ziehen.", "Ich zeige beide Schachgeber und finde einen legalen Königszug."], "exchange": ["Werte: Bauer 1, Springer 3, Läufer 3, Turm 5, Dame 9. Schlag und Rückschlag bis zum Ende rechnen: gewonnen minus abgegeben.", "Ich rechne einen Abtausch bis zum letzten Rückschlag aus."]};

async function pngBoard(fen){const g=new bridge.Chess(fen),size=400,pad=24,cell=44;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" fill="white"/>`;for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const x=pad+f*cell,y=pad+(8-r)*cell,p=g.get('abcdefgh'[f]+r);svg+=`<rect x="${x}" y="${y}" width="44" height="44" fill="${(f+r)%2?'#b8b8b8':'#fff'}" stroke="#777" stroke-width=".4"/>`;if(p){const name=`Chess_${p.type}${p.color==='w'?'l':'d'}t45.svg`;let raw=atob(window.FIGURE_DATA[name].split(',')[1]);raw=raw.slice(raw.indexOf('<svg'));const inner=raw.slice(raw.indexOf('>')+1,raw.lastIndexOf('</svg>'));svg+=`<g transform="translate(${x},${y}) scale(${cell/45})">${inner}</g>`}}for(let i=0;i<8;i++){svg+=`<text x="${pad+i*cell+22}" y="17" text-anchor="middle" font-size="13">${'abcdefgh'[i]}</text><text x="${pad+i*cell+22}" y="393" text-anchor="middle" font-size="13">${'abcdefgh'[i]}</text><text x="12" y="${pad+i*cell+27}" text-anchor="middle" font-size="13">${8-i}</text><text x="388" y="${pad+i*cell+27}" text-anchor="middle" font-size="13">${8-i}</text>`}svg+='</svg>';const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));try{const img=new Image();img.src=url;await img.decode();const canvas=document.createElement('canvas');canvas.width=400;canvas.height=400;canvas.getContext('2d').drawImage(img,0,0);const b=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!b)throw Error('Diagramm konnte nicht erzeugt werden.');return new Uint8Array(await b.arrayBuffer())}finally{URL.revokeObjectURL(url)}}
async function pngLab(lab){const url=URL.createObjectURL(new Blob([window.Labyrinth.svg(lab)],{type:'image/svg+xml'}));try{const img=new Image();img.src=url;await img.decode();const canvas=document.createElement('canvas');canvas.width=400;canvas.height=400;canvas.getContext('2d').drawImage(img,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('Labyrinthdiagramm konnte nicht erzeugt werden.');return new Uint8Array(await blob.arrayBuffer())}finally{URL.revokeObjectURL(url)}}
async function word(blocks,landscape){const d=await loadScript('docx.js','docx');const sections=[];let children=[],orient=landscape;const flush=()=>{if(children.length)sections.push({properties:{page:{size:{orientation:orient?d.PageOrientation.LANDSCAPE:d.PageOrientation.PORTRAIT},margin:{top:700,bottom:700,left:700,right:700}}},children});children=[]};for(const b of blocks){if(b.section){flush();orient=b.section==='landscape';continue}if(b.h===2&&b.newpage)children.push(new d.Paragraph({children:[new d.PageBreak()]}));if(b.lead!==undefined){children.push(new d.Paragraph({children:[new d.TextRun({text:b.lead,bold:true}),...(b.text?[new d.TextRun({text:' '+b.text})]:[])],spacing:{after:80}}));continue}if(b.page){children.push(new d.Paragraph({children:[new d.PageBreak()]}));continue}if(b.fen||b.labyrinth){try{children.push(new d.Paragraph({children:[new d.ImageRun({type:'png',data:b.labyrinth?await pngLab(b.labyrinth):await pngBoard(b.fen),transformation:{width:orient===false&&sections.length?170:230,height:orient===false&&sections.length?170:230}})],keepNext:true}));}catch(e){children.push(new d.Paragraph({text:b.fen?'Diagramm (FEN): '+b.fen:'Labyrinth-Diagramm'}))}continue}if(b.table){children.push(new d.Table({width:{size:100,type:d.WidthType.PERCENTAGE},rows:b.table.map((r,i)=>new d.TableRow({tableHeader:i===0,cantSplit:true,children:r.map((c,ci)=>new d.TableCell({...(b.widths?{width:{size:b.widths[ci],type:d.WidthType.PERCENTAGE}}:{}),children:String(c).split('\n').map(t=>new d.Paragraph({children:[new d.TextRun({text:t,bold:i===0,size:20})]}))}))}))}));continue}children.push(new d.Paragraph({text:b.text||'',heading:b.h?d.HeadingLevel['HEADING_'+Math.min(b.h,3)]:undefined,keepNext:!!b.h,spacing:{after:120}}))}flush();const doc=new d.Document({creator:'SchachStunde',title:current().title,styles:{default:{document:{run:{font:'Arial',size:22}}}},sections});download(await d.Packer.toBlob(doc),'SchachStunde-'+(landscape?'Verlaufsplan':'Material')+'.docx')}
